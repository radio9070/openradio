<!-- Audio sin preload agresivo para no saturar los slots de Listen2MyRadio -->
  <audio id="radio" preload="none" playsinline webkit-playsinline></audio>

  <script>
    const streamUrl = "https://uk24freenew.listen2myradio.com/live.mp3?typeportmount=s2_24429_stream_335822499";
    const bgImage = "https://i.imgur.com/wQhe42X.png";
    const radioLogo = "https://i.imgur.com/DHOJTCz.jpeg";

    const audio = document.getElementById('radio');
    const playIcon = document.getElementById('play-icon');
    const volumeSlider = document.getElementById('volume');
    const songTitle = document.getElementById('song-title');

    let isPlaying = false;

    function setBlurBackground(url) {
      const isMobile = window.innerWidth < 768;
      const bg = document.getElementById("background-blur");
      if (bg && url) {
        bg.style.filter = isMobile ? "blur(30px)" : "none";
        bg.style.opacity = isMobile ? "0.6" : "1";
        bg.style.backgroundImage = `url(${url})`;
        document.body.style.backgroundColor = "black";
        bg.style.display = "block";
      }
    }

    function configurarMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Transmitiendo en vivo',
          artist: 'OPEN RADIO',
          album: 'En Vivo',
          artwork: [
            { src: radioLogo, sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      }
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        audio.removeAttribute('src'); // Libera la ranura en el servidor de Listen2MyRadio
        audio.load();
        isPlaying = false;
        playIcon.src = "https://img.icons8.com/ios-filled/50/ffffff/play--v1.png";
        songTitle.textContent = "Pausado";
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
      } else {
        songTitle.textContent = "Conectando...";
        playIcon.src = "https://img.icons8.com/ios-filled/50/ffffff/pause--v1.png";
        isPlaying = true;

        // Asignamos la URL directamente en el momento que la persona presiona play
        audio.src = streamUrl;
        audio.load();

        const playPromise = audio.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              songTitle.textContent = "Transmitiendo en vivo";
              configurarMediaSession();
              if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
            })
            .catch(err => {
              console.warn("Error de conexión:", err);
              isPlaying = false;
              playIcon.src = "https://img.icons8.com/ios-filled/50/ffffff/play--v1.png";
              songTitle.textContent = "Emisora fuera de línea";
            });
        }
      }
    }

    // Captura si el servidor expulsa o no responde
    audio.addEventListener('error', (e) => {
      if (isPlaying) {
        console.error("Fallo en el flujo:", e);
        isPlaying = false;
        playIcon.src = "https://img.icons8.com/ios-filled/50/ffffff/play--v1.png";
        songTitle.textContent = "Señal no disponible";
      }
    });

    volumeSlider.addEventListener("input", () => {
      audio.volume = volumeSlider.value;
    });

    document.addEventListener("DOMContentLoaded", function () {
      setBlurBackground(bgImage);
    });
  </script>
